name: 유지보수 작업
description: 작업 범위와 완료 조건을 명확히 정의한다
title: "[유지보수] "
labels: ["maintenance"]

body:
  - type: markdown
    attributes:
      value: |
        이 Issue는 작업을 시작하기 전에 **무엇을 왜 바꾸고, 어디까지 되면 끝인지** 정하기 위한 작업 계약서다.

        아래 6개 항목을 기준으로 구현하고 검증한다.
        특히 **종료 조건은 구현 후 실제로 참·거짓을 판정할 수 있게 작성한다.**

  - type: textarea
    id: background
    attributes:
      label: 1. 배경 — 왜 필요한가
      description: |
        현재 어떤 문제가 있고, 이 작업을 하지 않으면 무엇이 남는지 적는다.
        해결 방법보다 현재 상황과 문제를 중심으로 쓴다.
      placeholder: |
        예) 출고 화면에서 동일한 로트가 여러 줄로 표시되어
        사용자가 같은 로트인지 화면만 보고 판단하기 어렵다.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용 — 무엇을 수정하는가
      description: |
        이번 작업에서 바꿀 기능이나 동작을 적는다.
        알고 있다면 관련 파일·함수·화면도 함께 적는다.
      placeholder: |
        예) 출고 화면의 로트 목록을 동일 로트 기준으로 묶어 표시한다.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 3. 종료 조건 — 무엇이 참이면 완료인가
      description: |
        구현이 끝났는지 누구나 같은 결론을 낼 수 있도록 작성한다.

        각 조건에는 다음 세 가지가 드러나야 한다.

        **어떤 상태·입력에서 → 무엇을 하면 → 어떤 결과가 나와야 하는가**

        "정상 동작한다", "개선한다", "잘 처리한다"처럼
        사람마다 다르게 해석할 수 있는 표현은 피한다.

        예)
        - 동일한 로트가 3건 있을 때 출고 화면을 열면 목록에 1개 행으로 표시된다.
        - 재고가 40개일 때 41개 출고를 요청하면 실패하고 재고 수량은 40개로 유지된다.
        - 20개·40개 두 로트에서 30개를 출고하면 먼저 만료되는 로트에서 20개, 다음 로트에서 10개가 차감된다.

        가능하면 각 조건은 테스트나 명령으로 검증할 수 있어야 한다.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: machine-check
    attributes:
      label: 4. 기계 검증 — 어떻게 확인하는가
      description: |
        3번의 종료 조건을 판정할 테스트를 적는다.

        Issue 전용 테스트는 `tests/issues/issue-<번호>-<기능명>.test.ts`에 만들고,
        **종료 조건 한 줄마다 대응하는 테스트를 하나씩 둔다.**

        전용 테스트는 `npm run verify`에서 함께 실행된다.
      value: |
        - [ ] `npm run verify` 통과
        - [ ] 전용 테스트: `tests/issues/issue-<번호>-<기능명>.test.ts`
        - [ ] 함께 수정하는 기존 테스트:
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: 5. 건드리면 안 되는 것 — 변경 범위는 어디까지인가
      description: |
        이번 작업에서 변경하지 않을 기능이나 영역을 적는다.
        작업 범위가 불필요하게 커지는 것을 막기 위한 경계다.
      placeholder: |
        예) 출고 화면만 수정한다. 입고·이동 기능의 동작은 변경하지 않는다.
    validations:
      required: true

  - type: dropdown
    id: max-loops
    attributes:
      label: 6. 구현·검증 시도 최대 횟수 — verify 를 몇 번까지 돌리는가
      description: |
        구현을 변경한 뒤 `npm run verify` 를 한 번 돌려 결과를 얻은 것이 1 회다.
        통과·실패를 가리지 않고 한 번으로 센다 — 3 이면 verify 도 최대 3 회다.
        이 횟수에 도달하면 반복을 중단하고 사람이 원인을 확인한다.

        세는 방법과 진행 상태 기록 방식의 원본은 `docs/harness/03-loop.md` 다.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
      default: 2
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 (선택)
      description: |
        관련 Issue·PR, 재현 절차, 스크린샷, 참고 문서 등이 있으면 적는다.
    validations:
      required: false